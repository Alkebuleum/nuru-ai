    <line x1="32" y1="6"  x2="32" y2="17"/>
    <line x1="32" y1="47" x2="32" y2="58"/>
    <line x1="6"  y1="32" x2="17" y2="32"/>
    <line x1="47" y1="32" x2="58" y2="32"/>
    <line x1="13" y1="13" x2="20" y2="20"/>
    <line x1="44" y1="44" x2="51" y2="51"/>
    <line x1="51" y1="13" x2="44" y2="20"/>
    <line x1="13" y1="51" x2="20" y2="44"/>
  </g>

  <!-- Core dot -->
  <circle cx="32" cy="32" r="9" fill="url(#g)"/>
</svg>
